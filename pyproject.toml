[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "adithya-domain-specific-bpe-tokenizer"
version = "0.1.0"
description = "A domain specific BPE tokenizer for medical and general corpora"
readme = "README.md"
requires-python = ">=3.9"
license = {text = "MIT"}

authors = [
    {name = "Adithya Prabhu"}
]

keywords = [
    "tokenizer",
    "bpe",
    "nlp",
    "llm",
    "medical-nlp",
    "byte-pair-encoding"
]

classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
]

dependencies = []

[tool.setuptools.packages.find]
where = ["."]